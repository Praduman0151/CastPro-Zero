name: CastPro-Zero Android CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: castpro-zero-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    name: Unit tests and debug APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate official Gradle Wrapper
        run: gradle wrapper --gradle-version 8.13
      - name: Upload official Gradle Wrapper files
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-files
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: error
          retention-days: 30
      - name: Run unit tests and build both APKs
        run: ./gradlew :core-protocol:test :app-phone:testDebugUnitTest :app-tv:testDebugUnitTest :app-phone:assembleDebug :app-tv:assembleDebug
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: app-phone-debug.apk
          path: app-phone/build/outputs/apk/debug/app-phone-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: app-tv-debug.apk
          path: app-tv/build/outputs/apk/debug/app-tv-debug.apk
          if-no-files-found: error
          retention-days: 30
